<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my-finance-tracker | Хувийн санхүү бүртгэл</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="index" class="roboto-regular">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4 rounded-4">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4 fw-bold text-success">
                            <i class="fa-solid fa-sack-dollar text-warning"></i> my-finance-tracker
                        </h3>
                        <p class="text-muted text-center small mb-4">Нэвтрэх эсвэл шинэ бүртгэл үүсгэнэ үү</p>

                        <form id="auth-form">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Имэйл хаяг</label>
                                <input type="email" class="form-control form-control-lg" id="email" placeholder="name@gmail.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Нууц үг</label>
                                <input type="password" class="form-control form-control-lg" id="password" placeholder="Хамгийн багадаа 6 тэмдэгт" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 py-2 mb-2">Нэвтрэх</button>
                            <button type="button" class="btn btn-outline-dark w-100 py-2" id="btn-register">Бүртгүүлэх</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
